services:
  api01:
    container_name: api01
    build: ./api
    ports:
      - "3000:3000"

  api02:
    container_name: api02
    build: ./api
    ports:
      - "3001:3000"

  api03:
    container_name: api03
    build: ./api
    ports:
      - "3002:3000"

  db:
    container_name: db01
    image: postgres:17
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: